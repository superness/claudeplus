<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHA-256 Crypto Pricer</title>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --border-color: #30363d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent-blue: #58a6ff;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-yellow: #d29922;
      --accent-purple: #a371f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 .icon {
      font-size: 28px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--bg-card);
      border-color: var(--text-muted);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.primary {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .btn.primary:hover {
      filter: brightness(1.1);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background: var(--text-secondary);
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(20px);
      background: #fff;
    }

    /* Coin Filter */
    .coin-filter {
      position: relative;
    }

    .coin-filter-btn {
      min-width: 160px;
      justify-content: space-between;
    }

    .coin-filter-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 100;
      display: none;
    }

    .coin-filter-dropdown.open {
      display: block;
    }

    .coin-filter-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .coin-filter-item:hover {
      background: var(--bg-card);
    }

    .coin-filter-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-blue);
    }

    .coin-filter-item .coin-symbol {
      font-weight: 600;
      color: var(--text-primary);
      min-width: 50px;
    }

    .coin-filter-item .coin-name {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .coin-filter-actions {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
    }

    .coin-filter-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      flex-wrap: wrap;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .status-item .value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background: var(--accent-red);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Price Grid */
    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    /* Coin Card */
    .coin-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
    }

    .coin-card:hover {
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .coin-card.price-up {
      animation: flashGreen 0.5s ease-out;
    }

    .coin-card.price-down {
      animation: flashRed 0.5s ease-out;
    }

    @keyframes flashGreen {
      0% { background: rgba(63, 185, 80, 0.3); }
      100% { background: var(--bg-secondary); }
    }

    @keyframes flashRed {
      0% { background: rgba(248, 81, 73, 0.3); }
      100% { background: var(--bg-secondary); }
    }

    .coin-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .coin-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: var(--accent-blue);
    }

    .coin-icon img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .coin-info h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .coin-info .symbol {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .coin-price {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Change Indicators */
    .changes {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .change-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .change-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .change-item .value {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .change-item .value.positive {
      color: var(--accent-green);
    }

    .change-item .value.negative {
      color: var(--accent-red);
    }

    .change-item .value .arrow {
      font-size: 10px;
    }

    /* Stats */
    .coin-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-item .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-item .value {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Algorithm Badge */
    .algo-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      background: var(--bg-card);
      border-radius: 4px;
      font-size: 11px;
      color: var(--accent-purple);
      margin-left: auto;
    }

    /* Loading State */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(13, 17, 23, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .loading-content {
      text-align: center;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    /* Error State */
    .error-message {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      color: var(--accent-red);
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .controls {
        width: 100%;
        justify-content: space-between;
      }

      .price-grid {
        grid-template-columns: 1fr;
      }

      .status-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>
        <span class="icon">💰</span>
        SHA-256 Crypto Pricer
      </h1>
      <div class="controls">
        <!-- Coin Filter -->
        <div class="coin-filter">
          <button class="btn coin-filter-btn" id="coinFilterBtn">
            <span id="selectedCount">All Coins</span>
            <span>▼</span>
          </button>
          <div class="coin-filter-dropdown" id="coinFilterDropdown">
            <div id="coinFilterList"></div>
            <div class="coin-filter-actions">
              <button class="btn" onclick="selectAllCoins()">Select All</button>
              <button class="btn" onclick="selectNone()">Clear</button>
            </div>
          </div>
        </div>

        <!-- Auto-refresh Toggle -->
        <div class="control-group">
          <label>Auto-refresh</label>
          <label class="toggle">
            <input type="checkbox" id="autoRefreshToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Manual Refresh -->
        <button class="btn primary" id="refreshBtn" onclick="refreshPrices()">
          <span id="refreshBtnText">🔄 Refresh</span>
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item">
        <span class="status-dot" id="statusDot"></span>
        <span id="connectionStatus">Connected</span>
      </div>
      <div class="status-item">
        <span>Last update:</span>
        <span class="value" id="lastUpdate">--</span>
      </div>
      <div class="status-item">
        <span>Next refresh:</span>
        <span class="value" id="nextRefresh">--</span>
      </div>
      <div class="status-item">
        <span>Coins tracked:</span>
        <span class="value" id="coinsTracked">--</span>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-message" id="errorMessage"></div>

    <!-- Price Grid -->
    <div class="price-grid" id="priceGrid">
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>Loading prices...</p>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Fetching prices...</p>
    </div>
  </div>

  <script>
    // State
    let prices = {};
    let previousPrices = {};
    let availableCoins = {};
    let selectedCoins = new Set();
    let autoRefreshEnabled = true;
    let refreshInterval = null;
    let countdownInterval = null;
    let nextRefreshTime = null;
    const REFRESH_INTERVAL = 30000; // 30 seconds

    // Format helpers
    function formatPrice(price, decimals = 2) {
      if (price === null || price === undefined) return 'N/A';
      if (price >= 1) {
        return '$' + price.toLocaleString('en-US', {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals
        });
      }
      return '$' + price.toFixed(Math.max(decimals, 6));
    }

    function formatChange(change) {
      if (change === null || change === undefined) return 'N/A';
      const sign = change >= 0 ? '+' : '';
      return sign + change.toFixed(2) + '%';
    }

    function formatMarketCap(cap) {
      if (!cap) return 'N/A';
      if (cap >= 1e12) return '$' + (cap / 1e12).toFixed(2) + 'T';
      if (cap >= 1e9) return '$' + (cap / 1e9).toFixed(2) + 'B';
      if (cap >= 1e6) return '$' + (cap / 1e6).toFixed(2) + 'M';
      if (cap >= 1e3) return '$' + (cap / 1e3).toFixed(2) + 'K';
      return '$' + cap.toFixed(2);
    }

    function formatTime(date) {
      if (!date) return '--';
      const d = new Date(date);
      return d.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    // API calls
    async function fetchPrices(forceRefresh = false) {
      const endpoint = forceRefresh ? '/api/prices/refresh' : '/api/prices';
      const response = await fetch(endpoint);
      if (!response.ok) throw new Error('Failed to fetch prices');
      return response.json();
    }

    async function fetchCoins() {
      const response = await fetch('/api/coins');
      if (!response.ok) throw new Error('Failed to fetch coins');
      return response.json();
    }

    // UI Updates
    function updateStatusBar(data) {
      document.getElementById('lastUpdate').textContent = formatTime(data.lastUpdate);
      document.getElementById('coinsTracked').textContent = Object.keys(data.data || {}).length;
    }

    function updateCountdown() {
      if (!nextRefreshTime || !autoRefreshEnabled) {
        document.getElementById('nextRefresh').textContent = '--';
        return;
      }
      const remaining = Math.max(0, Math.ceil((nextRefreshTime - Date.now()) / 1000));
      document.getElementById('nextRefresh').textContent = remaining + 's';
    }

    function showError(message) {
      const el = document.getElementById('errorMessage');
      el.textContent = message;
      el.classList.add('visible');
      document.getElementById('statusDot').classList.add('offline');
      document.getElementById('connectionStatus').textContent = 'Error';
    }

    function clearError() {
      document.getElementById('errorMessage').classList.remove('visible');
      document.getElementById('statusDot').classList.remove('offline');
      document.getElementById('connectionStatus').textContent = 'Connected';
    }

    function setLoading(loading) {
      const btn = document.getElementById('refreshBtn');
      const text = document.getElementById('refreshBtnText');
      if (loading) {
        btn.disabled = true;
        text.innerHTML = '<span class="spinner"></span> Loading...';
      } else {
        btn.disabled = false;
        text.innerHTML = '🔄 Refresh';
      }
    }

    function renderPriceCard(symbol, data) {
      const prevPrice = previousPrices[symbol]?.price;
      const priceClass = prevPrice && data.price !== prevPrice
        ? (data.price > prevPrice ? 'price-up' : 'price-down')
        : '';

      const changeClass = (val) => val >= 0 ? 'positive' : 'negative';
      const arrow = (val) => val >= 0 ? '▲' : '▼';

      return `
        <div class="coin-card ${priceClass}" data-symbol="${symbol}">
          <div class="coin-header">
            <div class="coin-icon">
              ${data.image ? `<img src="${data.image}" alt="${symbol}" onerror="this.style.display='none';this.parentElement.textContent='${symbol}'">` : symbol}
            </div>
            <div class="coin-info">
              <h3>${data.name}</h3>
              <span class="symbol">${symbol}</span>
            </div>
            <span class="algo-badge">${data.algorithm || 'SHA-256'}</span>
          </div>

          <div class="coin-price">${formatPrice(data.price)}</div>

          <div class="changes">
            <div class="change-item">
              <span class="label">1H</span>
              <span class="value ${changeClass(data.change1h)}">
                <span class="arrow">${arrow(data.change1h)}</span>
                ${formatChange(data.change1h)}
              </span>
            </div>
            <div class="change-item">
              <span class="label">24H</span>
              <span class="value ${changeClass(data.change24h)}">
                <span class="arrow">${arrow(data.change24h)}</span>
                ${formatChange(data.change24h)}
              </span>
            </div>
            <div class="change-item">
              <span class="label">7D</span>
              <span class="value ${changeClass(data.change7d)}">
                <span class="arrow">${arrow(data.change7d)}</span>
                ${formatChange(data.change7d)}
              </span>
            </div>
          </div>

          <div class="coin-stats">
            <div class="stat-item">
              <span class="label">Market Cap</span>
              <span class="value">${formatMarketCap(data.marketCap)}</span>
            </div>
            <div class="stat-item">
              <span class="label">24h Volume</span>
              <span class="value">${formatMarketCap(data.volume24h)}</span>
            </div>
            <div class="stat-item">
              <span class="label">24h High</span>
              <span class="value">${formatPrice(data.high24h)}</span>
            </div>
            <div class="stat-item">
              <span class="label">24h Low</span>
              <span class="value">${formatPrice(data.low24h)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderPrices() {
      const grid = document.getElementById('priceGrid');

      // Filter to selected coins
      const visiblePrices = Object.entries(prices)
        .filter(([symbol]) => selectedCoins.size === 0 || selectedCoins.has(symbol))
        .sort((a, b) => (b[1].marketCap || 0) - (a[1].marketCap || 0));

      if (visiblePrices.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>No coins selected. Use the filter to select coins.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = visiblePrices.map(([symbol, data]) => renderPriceCard(symbol, data)).join('');
    }

    // Coin Filter
    function renderCoinFilter() {
      const list = document.getElementById('coinFilterList');
      list.innerHTML = Object.entries(availableCoins)
        .sort(([,a], [,b]) => a.name.localeCompare(b.name))
        .map(([symbol, coin]) => `
          <label class="coin-filter-item">
            <input type="checkbox" value="${symbol}" ${selectedCoins.size === 0 || selectedCoins.has(symbol) ? 'checked' : ''}>
            <span class="coin-symbol">${symbol}</span>
            <span class="coin-name">${coin.name}</span>
          </label>
        `).join('');

      // Add change listeners
      list.querySelectorAll('input').forEach(input => {
        input.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedCoins.add(e.target.value);
          } else {
            selectedCoins.delete(e.target.value);
          }
          updateSelectedCount();
          renderPrices();
        });
      });
    }

    function updateSelectedCount() {
      const count = selectedCoins.size;
      const total = Object.keys(availableCoins).length;
      document.getElementById('selectedCount').textContent =
        count === 0 || count === total ? 'All Coins' : `${count} Selected`;
    }

    function selectAllCoins() {
      selectedCoins = new Set(Object.keys(availableCoins));
      document.querySelectorAll('#coinFilterList input').forEach(input => input.checked = true);
      updateSelectedCount();
      renderPrices();
    }

    function selectNone() {
      selectedCoins.clear();
      document.querySelectorAll('#coinFilterList input').forEach(input => input.checked = false);
      updateSelectedCount();
      renderPrices();
    }

    // Toggle dropdown
    document.getElementById('coinFilterBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('coinFilterDropdown').classList.toggle('open');
    });

    document.addEventListener('click', () => {
      document.getElementById('coinFilterDropdown').classList.remove('open');
    });

    document.getElementById('coinFilterDropdown').addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Auto-refresh toggle
    document.getElementById('autoRefreshToggle').addEventListener('change', (e) => {
      autoRefreshEnabled = e.target.checked;
      if (autoRefreshEnabled) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }
    });

    function startAutoRefresh() {
      stopAutoRefresh();
      refreshInterval = setInterval(loadPrices, REFRESH_INTERVAL);
      nextRefreshTime = Date.now() + REFRESH_INTERVAL;
      countdownInterval = setInterval(updateCountdown, 1000);
      updateCountdown();
    }

    function stopAutoRefresh() {
      if (refreshInterval) {
        clearInterval(refreshInterval);
        refreshInterval = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      nextRefreshTime = null;
      document.getElementById('nextRefresh').textContent = '--';
    }

    // Load prices
    async function loadPrices(forceRefresh = false) {
      try {
        setLoading(true);
        const result = await fetchPrices(forceRefresh);

        if (result.success) {
          previousPrices = { ...prices };
          prices = result.data;
          clearError();
          updateStatusBar(result);
          renderPrices();

          if (autoRefreshEnabled) {
            nextRefreshTime = Date.now() + REFRESH_INTERVAL;
          }
        } else {
          showError(result.error || 'Failed to fetch prices');
        }
      } catch (error) {
        showError(error.message);
      } finally {
        setLoading(false);
      }
    }

    // Manual refresh
    async function refreshPrices() {
      await loadPrices(true);
      if (autoRefreshEnabled) {
        startAutoRefresh(); // Reset the timer
      }
    }

    // Initialize
    async function init() {
      document.getElementById('loadingOverlay').classList.remove('hidden');

      try {
        // Load available coins
        const coinsResult = await fetchCoins();
        if (coinsResult.success) {
          availableCoins = coinsResult.data;
          renderCoinFilter();
        }

        // Load initial prices
        await loadPrices();

        // Start auto-refresh
        if (autoRefreshEnabled) {
          startAutoRefresh();
        }
      } catch (error) {
        showError('Failed to initialize: ' + error.message);
      } finally {
        document.getElementById('loadingOverlay').classList.add('hidden');
      }
    }

    // Start
    init();
  </script>
</body>
</html>
