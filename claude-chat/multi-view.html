<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Chat - Multi-View Dashboard</title>
    <link rel="stylesheet" href="css/multi-view.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="logo">
                    <span class="logo-icon">🔮</span>
                    Claude Multi-View
                </h1>
                <span class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </span>
            </div>
            <div class="header-right">
                <div class="stats-bar">
                    <div class="stat">
                        <span class="stat-label">Active Tabs</span>
                        <span class="stat-value" id="tabCount">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Messages/min</span>
                        <span class="stat-value" id="messagesPerMin">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Total Cost</span>
                        <span class="stat-value" id="totalCost">$0.00</span>
                    </div>
                </div>
                <button class="layout-toggle" id="layoutToggle" title="Toggle Layout">
                    <span class="layout-icon">◫</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-main">
            <div class="tabs-grid" id="tabsGrid">
                <!-- Tab cards will be dynamically inserted here -->
                <div class="placeholder-card" id="placeholderCard">
                    <div class="placeholder-content">
                        <span class="placeholder-icon">💬</span>
                        <h3>No Active Conversations</h3>
                        <p>Open tabs in Claude Chat to see them appear here in real-time</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Focus Modal -->
        <div class="focus-modal" id="focusModal">
            <div class="focus-modal-content">
                <div class="focus-header">
                    <h2 class="focus-title" id="focusTitle">Tab Details</h2>
                    <button class="focus-close" id="focusClose">×</button>
                </div>
                <div class="focus-body" id="focusBody">
                    <!-- Full conversation view -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/multi-view.js"></script>
</body>
</html>
