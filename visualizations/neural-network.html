<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network - Chat API Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10, 10, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            backdrop-filter: blur(10px);
            max-width: 280px;
        }

        .overlay h1 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #88aaff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layer-info {
            margin-bottom: 15px;
        }

        .layer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin: 4px 0;
            background: rgba(50, 80, 150, 0.2);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .layer-name {
            color: #aaccff;
        }

        .layer-count {
            font-weight: 600;
            color: #88ff88;
        }

        .signal-log {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
            max-height: 200px;
            overflow-y: auto;
        }

        .signal-log h3 {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }

        .signal {
            font-size: 0.75rem;
            padding: 4px 8px;
            margin: 3px 0;
            border-radius: 4px;
            background: rgba(50, 80, 150, 0.15);
            color: #aaa;
            animation: fadeIn 0.3s ease;
        }

        .signal.active {
            background: rgba(100, 200, 100, 0.2);
            color: #88ff88;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .tooltip {
            position: fixed;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(100, 150, 255, 0.5);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 200;
            max-width: 280px;
            display: none;
        }

        .tooltip h4 {
            color: #88aaff;
            margin-bottom: 8px;
        }

        .tooltip .detail {
            color: #aaa;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="overlay">
        <h1>🧠 Neural Network</h1>
        <div class="layer-info">
            <div class="layer-row">
                <span class="layer-name">Input (Requests)</span>
                <span class="layer-count" id="inputCount">0</span>
            </div>
            <div class="layer-row">
                <span class="layer-name">Hidden (Tools)</span>
                <span class="layer-count" id="hiddenCount">0</span>
            </div>
            <div class="layer-row">
                <span class="layer-name">Output (Results)</span>
                <span class="layer-count" id="outputCount">0</span>
            </div>
        </div>
        <div class="signal-log">
            <h3>Signal Activity</h3>
            <div id="signalList"></div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        const signalList = document.getElementById('signalList');

        let width, height;
        let nodes = { input: [], hidden: [], output: [] };
        let connections = [];
        let signals = [];
        let time = 0;

        const TOOL_COLORS = {
            'Read': '#4488ff',
            'Write': '#44ff88',
            'Edit': '#ffaa44',
            'Bash': '#ff4466',
            'Grep': '#aa44ff',
            'Glob': '#44ddff',
            'Task': '#44ffff',
            'TodoWrite': '#88ff88',
            'default': '#6688aa'
        };

        class Node {
            constructor(x, y, type, data) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.data = data;
                this.radius = type === 'hidden' ? 15 : 25;
                this.activation = 0;
                this.targetActivation = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.activation += (this.targetActivation - this.activation) * 0.1;
                if (this.activation < 0.01 && this.targetActivation === 0) {
                    this.activation = 0;
                }
            }

            activate(amount = 1) {
                this.targetActivation = Math.min(1, this.targetActivation + amount);
                setTimeout(() => {
                    this.targetActivation = Math.max(0, this.targetActivation - amount);
                }, 500);
            }

            draw(ctx) {
                const pulse = Math.sin(time * 0.05 + this.pulsePhase) * 0.15;
                const glowIntensity = this.activation + 0.2 + pulse;

                // Glow
                ctx.save();
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius * 2
                );

                let color;
                if (this.type === 'input') {
                    color = this.data?.status === 'running' ? '#ffaa44' : '#4488ff';
                } else if (this.type === 'hidden') {
                    color = TOOL_COLORS[this.data?.name] || TOOL_COLORS.default;
                } else {
                    color = this.data?.status === 'completed' ? '#44ff88' : '#888888';
                }

                gradient.addColorStop(0, color);
                gradient.addColorStop(0.5, color + '44');
                gradient.addColorStop(1, 'transparent');

                ctx.fillStyle = gradient;
                ctx.globalAlpha = glowIntensity * 0.6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Core
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.8 + this.activation * 0.2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.restore();

                // Label
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = this.type === 'hidden' ? '9px monospace' : '10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = 0.9;

                let label;
                if (this.type === 'input') {
                    label = this.data?.id?.slice(-6) || '?';
                } else if (this.type === 'hidden') {
                    label = (this.data?.name || '?').slice(0, 4);
                } else {
                    label = this.data?.status?.slice(0, 4) || '?';
                }
                ctx.fillText(label, this.x, this.y);
                ctx.restore();
            }

            containsPoint(x, y) {
                const dx = x - this.x;
                const dy = y - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius + 5;
            }
        }

        class Connection {
            constructor(from, to, weight = 0.5) {
                this.from = from;
                this.to = to;
                this.weight = weight;
                this.activity = 0;
            }

            draw(ctx) {
                const alpha = 0.1 + this.activity * 0.5;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.from.x, this.from.y);
                ctx.lineTo(this.to.x, this.to.y);
                ctx.strokeStyle = `rgba(100, 150, 255, ${alpha})`;
                ctx.lineWidth = 1 + this.activity * 2;
                ctx.stroke();
                ctx.restore();

                // Decay activity
                this.activity *= 0.95;
            }

            fire() {
                this.activity = 1;
                this.to.activate(this.weight);
            }
        }

        class Signal {
            constructor(connection) {
                this.connection = connection;
                this.progress = 0;
                this.speed = 0.02 + Math.random() * 0.02;
            }

            update() {
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.connection.fire();
                    return false;
                }
                return true;
            }

            draw(ctx) {
                const x = this.connection.from.x + (this.connection.to.x - this.connection.from.x) * this.progress;
                const y = this.connection.from.y + (this.connection.to.y - this.connection.from.y) * this.progress;

                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#88ccff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#88ccff';
                ctx.fill();
                ctx.restore();
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            layoutNodes();
        }

        function layoutNodes() {
            const layerX = {
                input: width * 0.15,
                hidden: width * 0.5,
                output: width * 0.85
            };

            for (const layer of ['input', 'hidden', 'output']) {
                const count = nodes[layer].length;
                const spacing = Math.min(80, (height - 100) / (count + 1));
                const startY = (height - (count - 1) * spacing) / 2;

                nodes[layer].forEach((node, i) => {
                    node.x = layerX[layer];
                    node.y = startY + i * spacing;
                });
            }

            // Rebuild connections
            connections = [];
            for (const inputNode of nodes.input) {
                for (const hiddenNode of nodes.hidden) {
                    connections.push(new Connection(inputNode, hiddenNode, 0.5));
                }
            }
            for (const hiddenNode of nodes.hidden) {
                for (const outputNode of nodes.output) {
                    connections.push(new Connection(hiddenNode, outputNode, 0.5));
                }
            }
        }

        function render() {
            time++;

            // Clear
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Layer labels
            ctx.save();
            ctx.fillStyle = 'rgba(100, 150, 255, 0.3)';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('REQUESTS', width * 0.15, 40);
            ctx.fillText('TOOLS', width * 0.5, 40);
            ctx.fillText('RESULTS', width * 0.85, 40);
            ctx.restore();

            // Draw connections
            for (const conn of connections) {
                conn.draw(ctx);
            }

            // Update and draw signals
            signals = signals.filter(s => s.update());
            for (const signal of signals) {
                signal.draw(ctx);
            }

            // Update and draw nodes
            for (const layer of ['input', 'hidden', 'output']) {
                for (const node of nodes[layer]) {
                    node.update();
                    node.draw(ctx);
                }
            }

            // Update stats
            document.getElementById('inputCount').textContent = nodes.input.length;
            document.getElementById('hiddenCount').textContent = nodes.hidden.length;
            document.getElementById('outputCount').textContent = nodes.output.length;

            requestAnimationFrame(render);
        }

        function addSignalLog(message, isActive = false) {
            const div = document.createElement('div');
            div.className = 'signal' + (isActive ? ' active' : '');
            div.textContent = message;
            signalList.insertBefore(div, signalList.firstChild);

            // Keep only last 10 signals
            while (signalList.children.length > 10) {
                signalList.removeChild(signalList.lastChild);
            }
        }

        let previousToolIds = new Set();

        async function fetchData() {
            try {
                const response = await fetch('http://localhost:8081/api/chat/requests');
                const data = await response.json();

                const requests = (data.requests || []).map(r => ({
                    id: r.requestId,
                    status: r.status,
                    message: r.message,
                    tools: r.tools || [],
                    source: r.source
                }));

                // Build node lists
                const newInputNodes = [];
                const newHiddenNodes = [];
                const newOutputNodes = [];
                const allTools = [];

                for (const request of requests) {
                    // Input node for request
                    const existingInput = nodes.input.find(n => n.data?.id === request.id);
                    if (existingInput) {
                        existingInput.data = request;
                        newInputNodes.push(existingInput);
                    } else {
                        newInputNodes.push(new Node(0, 0, 'input', request));
                        addSignalLog(`Request: ${request.id.slice(-8)}`);
                    }

                    // Output node for completed requests
                    if (request.status === 'completed' || request.status === 'error') {
                        const existingOutput = nodes.output.find(n => n.data?.id === request.id);
                        if (existingOutput) {
                            existingOutput.data = request;
                            newOutputNodes.push(existingOutput);
                        } else {
                            newOutputNodes.push(new Node(0, 0, 'output', request));
                        }
                    }

                    // Collect tools
                    for (const tool of request.tools || []) {
                        const toolId = `${request.id}_${tool.name}_${tool.startTime}`;
                        tool.parentRequest = request.id;
                        tool.toolId = toolId;
                        allTools.push(tool);
                    }
                }

                // Hidden nodes for unique tool types
                const toolTypes = [...new Set(allTools.map(t => t.name))];
                for (const toolType of toolTypes) {
                    const toolsOfType = allTools.filter(t => t.name === toolType);
                    const existingHidden = nodes.hidden.find(n => n.data?.name === toolType);
                    if (existingHidden) {
                        existingHidden.data = { name: toolType, count: toolsOfType.length, tools: toolsOfType };
                        newHiddenNodes.push(existingHidden);
                    } else {
                        newHiddenNodes.push(new Node(0, 0, 'hidden', { name: toolType, count: toolsOfType.length, tools: toolsOfType }));
                    }
                }

                // Fire signals for new running tools
                const currentToolIds = new Set(allTools.filter(t => t.status === 'running').map(t => t.toolId));
                for (const toolId of currentToolIds) {
                    if (!previousToolIds.has(toolId)) {
                        const tool = allTools.find(t => t.toolId === toolId);
                        if (tool) {
                            // Find relevant connections and fire signals
                            const inputNode = newInputNodes.find(n => n.data?.id === tool.parentRequest);
                            const hiddenNode = newHiddenNodes.find(n => n.data?.name === tool.name);

                            if (inputNode && hiddenNode) {
                                const conn = connections.find(c => c.from === inputNode && c.to === hiddenNode);
                                if (conn) {
                                    signals.push(new Signal(conn));
                                    addSignalLog(`${tool.name} ← ${tool.parentRequest.slice(-6)}`, true);
                                }
                            }
                        }
                    }
                }
                previousToolIds = currentToolIds;

                // Update nodes
                nodes.input = newInputNodes;
                nodes.hidden = newHiddenNodes;
                nodes.output = newOutputNodes;

                layoutNodes();

            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            let hovered = null;
            for (const layer of ['input', 'hidden', 'output']) {
                for (const node of nodes[layer]) {
                    if (node.containsPoint(x, y)) {
                        hovered = node;
                        break;
                    }
                }
                if (hovered) break;
            }

            if (hovered) {
                tooltip.style.display = 'block';
                tooltip.style.left = (x + 15) + 'px';
                tooltip.style.top = (y + 15) + 'px';

                let content = '';
                if (hovered.type === 'input') {
                    content = `
                        <h4>Request</h4>
                        <div class="detail">ID: ${hovered.data?.id || 'unknown'}</div>
                        <div class="detail">Status: ${hovered.data?.status || 'unknown'}</div>
                        <div class="detail">Tools: ${hovered.data?.tools?.length || 0}</div>
                        ${hovered.data?.message ? `<div class="detail" style="font-style:italic">"${hovered.data.message.slice(0, 60)}..."</div>` : ''}
                    `;
                } else if (hovered.type === 'hidden') {
                    content = `
                        <h4>${hovered.data?.name || 'Tool'}</h4>
                        <div class="detail">Active instances: ${hovered.data?.count || 0}</div>
                        <div class="detail">Running: ${hovered.data?.tools?.filter(t => t.status === 'running').length || 0}</div>
                    `;
                } else {
                    content = `
                        <h4>Result</h4>
                        <div class="detail">Request: ${hovered.data?.id?.slice(-12) || 'unknown'}</div>
                        <div class="detail">Status: ${hovered.data?.status || 'unknown'}</div>
                    `;
                }
                tooltip.innerHTML = content;
            } else {
                tooltip.style.display = 'none';
            }
        });

        resize();
        window.addEventListener('resize', resize);

        fetchData();
        setInterval(fetchData, 1000);

        render();
    </script>
</body>
</html>
