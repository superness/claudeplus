<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Quest Monitor - Chat API Scrying Portal</title>

    <!-- Fantasy Fonts from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
           FANTASY RPG THEME - ARCANE QUEST MONITOR
           Tools are Spells, Requests are Quests, Claude is the Archmage
           ═══════════════════════════════════════════════════════════════════════════ */

        :root {
            /* Parchment & Leather Colors */
            --parchment-light: #f4e4bc;
            --parchment-dark: #d4c4a0;
            --parchment-burnt: #c4a060;
            --leather-brown: #5c4033;
            --leather-dark: #3d2817;
            --wood-dark: #2a1810;

            /* Magical Colors */
            --magic-gold: #ffd700;
            --magic-purple: #9b4dca;
            --magic-blue: #4a90d9;
            --magic-green: #4ade80;
            --magic-red: #dc2626;
            --magic-cyan: #22d3ee;
            --magic-glow: rgba(155, 77, 202, 0.4);

            /* Wax Seal Colors (Status) */
            --seal-active: #c41e3a;     /* Blood red - Quest Active */
            --seal-victory: #228b22;    /* Forest green - Victory */
            --seal-defeat: #8b0000;     /* Dark red - Defeat */
            --seal-pending: #808080;    /* Grey - Awaiting */

            /* Spell Colors (Tool Types) */
            --spell-scrying: #4a90d9;       /* Read - Scrying */
            --spell-inscription: #4ade80;    /* Write - Inscription */
            --spell-transmutation: #fbbf24;  /* Edit - Transmutation */
            --spell-conjuration: #ef4444;    /* Bash - Conjuration */
            --spell-divination: #9b4dca;     /* Grep - Divination */
            --spell-seeking: #22d3ee;        /* Glob - Seeking */

            /* UI */
            --border-gold: #c4a040;
            --border-gold-light: #e8d48b;
            --text-dark: #2a1810;
            --text-gold: #c4a040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IM Fell English', serif;
            background: linear-gradient(135deg, var(--leather-dark) 0%, var(--wood-dark) 50%, var(--leather-dark) 100%);
            min-height: 100vh;
            color: var(--parchment-light);
            overflow-x: hidden;
        }

        /* ═══ Parchment Background Pattern ═══ */
        .parchment-bg {
            background:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),
                linear-gradient(to bottom, var(--parchment-light) 0%, var(--parchment-dark) 100%);
            color: var(--text-dark);
        }

        /* ═══ Header - Archmage's Sanctum Banner ═══ */
        .header {
            background: linear-gradient(to bottom, var(--leather-brown), var(--leather-dark));
            border-bottom: 4px solid var(--border-gold);
            padding: 1rem 2rem;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header::before,
        .header::after {
            content: '⚜';
            font-size: 2rem;
            color: var(--magic-gold);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            text-shadow: 0 0 10px var(--magic-gold);
        }

        .header::before { left: 2rem; }
        .header::after { right: 2rem; }

        .header h1 {
            font-family: 'Uncial Antiqua', cursive;
            font-size: 2.5rem;
            color: var(--magic-gold);
            text-shadow:
                0 0 10px var(--magic-gold),
                0 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            color: var(--parchment-dark);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        /* ═══ Rune Decorations ═══ */
        .rune-border {
            position: relative;
        }

        .rune-border::before {
            content: '᛭ ᚱ ᚢ ᚾ ᛖ ᛊ ᛭';
            position: absolute;
            top: -1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--magic-purple);
            text-shadow: 0 0 5px var(--magic-purple);
            letter-spacing: 8px;
            opacity: 0.7;
        }

        /* ═══ Main Layout ═══ */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ═══ Fantasy Card Frame ═══ */
        .fantasy-card {
            background:
                linear-gradient(to bottom, var(--parchment-light) 0%, var(--parchment-dark) 100%);
            border: 3px solid var(--border-gold);
            border-radius: 8px;
            position: relative;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 var(--border-gold-light),
                inset 0 -1px 0 var(--leather-brown);
            color: var(--text-dark);
        }

        /* Gold corner decorations */
        .fantasy-card::before,
        .fantasy-card::after {
            content: '◆';
            position: absolute;
            color: var(--magic-gold);
            font-size: 1rem;
            text-shadow: 0 0 5px var(--magic-gold);
        }

        .fantasy-card::before { top: -0.5rem; left: -0.5rem; }
        .fantasy-card::after { top: -0.5rem; right: -0.5rem; }

        .card-corner-bl,
        .card-corner-br {
            position: absolute;
            bottom: -0.5rem;
            color: var(--magic-gold);
            font-size: 1rem;
            text-shadow: 0 0 5px var(--magic-gold);
        }

        .card-corner-bl { left: -0.5rem; }
        .card-corner-br { right: -0.5rem; }

        .card-header {
            background: linear-gradient(to right, var(--leather-brown), var(--leather-dark), var(--leather-brown));
            padding: 0.75rem 1rem;
            border-bottom: 2px solid var(--border-gold);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-header h2 {
            font-family: 'MedievalSharp', cursive;
            color: var(--magic-gold);
            font-size: 1.3rem;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
        }

        .card-header .icon {
            font-size: 1.5rem;
        }

        .card-body {
            padding: 1rem;
        }

        /* ═══ Quest Cards (Active Requests) ═══ */
        .quests-grid {
            display: grid;
            gap: 1.5rem;
        }

        .quest-card {
            background:
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Cpath d='M30 5L35 15L45 17L38 25L40 35L30 30L20 35L22 25L15 17L25 15z' fill='%23c4a040' fill-opacity='0.03'/%3E%3C/svg%3E"),
                linear-gradient(135deg, var(--parchment-light) 0%, var(--parchment-dark) 100%);
            position: relative;
            overflow: hidden;
        }

        /* Wax Seal Status Indicator */
        .wax-seal {
            position: absolute;
            top: -10px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow:
                0 4px 8px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            z-index: 10;
            transform: rotate(-15deg);
        }

        .wax-seal.quest-active {
            background: radial-gradient(circle at 30% 30%, #e85555 0%, var(--seal-active) 50%, #8a1426 100%);
            animation: seal-glow 2s ease-in-out infinite;
        }

        .wax-seal.victory {
            background: radial-gradient(circle at 30% 30%, #3cb371 0%, var(--seal-victory) 50%, #1a5a1a 100%);
        }

        .wax-seal.defeat {
            background: radial-gradient(circle at 30% 30%, #b22222 0%, var(--seal-defeat) 50%, #4a0000 100%);
        }

        @keyframes seal-glow {
            0%, 100% { box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 15px rgba(196, 30, 58, 0.4); }
            50% { box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 25px rgba(196, 30, 58, 0.7); }
        }

        .quest-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-gold);
        }

        .quest-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2rem;
            color: var(--leather-dark);
            margin-bottom: 0.5rem;
            padding-right: 60px;
        }

        .quest-id {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--leather-brown);
            opacity: 0.7;
        }

        .quest-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--leather-brown);
            margin-top: 0.5rem;
        }

        .quest-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ═══ Health/Mana Bars (Progress) ═══ */
        .progress-bars {
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.05);
        }

        .bar-container {
            margin-bottom: 0.5rem;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bar-track {
            height: 12px;
            background: var(--leather-dark);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-gold);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
            position: relative;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 5px 5px 0 0;
        }

        .bar-fill.health {
            background: linear-gradient(to right, #8b0000, #dc2626, #ef4444);
        }

        .bar-fill.mana {
            background: linear-gradient(to right, #1e3a5f, #3b82f6, #60a5fa);
        }

        /* ═══ Spellbook (Tools) ═══ */
        .spellbook {
            padding: 1rem;
        }

        .spellbook-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 0.9rem;
            color: var(--leather-dark);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spells-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .spell-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'IM Fell English', serif;
            border: 1px solid;
            position: relative;
            overflow: hidden;
        }

        /* Spell casting animation */
        .spell-tag.casting {
            animation: spell-cast 1.5s ease-in-out infinite;
        }

        .spell-tag.casting::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: spell-rotate 2s linear infinite;
        }

        @keyframes spell-cast {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 15px currentColor, 0 0 25px currentColor; }
        }

        @keyframes spell-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Spell type colors */
        .spell-scrying { background: rgba(74, 144, 217, 0.2); border-color: var(--spell-scrying); color: #1e5a9a; }
        .spell-inscription { background: rgba(74, 222, 128, 0.2); border-color: var(--spell-inscription); color: #166534; }
        .spell-transmutation { background: rgba(251, 191, 36, 0.2); border-color: var(--spell-transmutation); color: #92400e; }
        .spell-conjuration { background: rgba(239, 68, 68, 0.2); border-color: var(--spell-conjuration); color: #991b1b; }
        .spell-divination { background: rgba(155, 77, 202, 0.2); border-color: var(--spell-divination); color: #6b21a8; }
        .spell-seeking { background: rgba(34, 211, 238, 0.2); border-color: var(--spell-seeking); color: #0e7490; }

        .spell-icon {
            font-size: 1rem;
        }

        .spell-status {
            font-size: 0.7rem;
        }

        /* ═══ Crystal Ball (Streaming Output) ═══ */
        .crystal-ball-container {
            padding: 1rem;
            position: relative;
        }

        .crystal-ball {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 50%, #000 100%);
            border: 3px solid var(--magic-purple);
            border-radius: 50%;
            aspect-ratio: 1;
            max-width: 250px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 30px var(--magic-glow),
                inset 0 0 50px rgba(155, 77, 202, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Swirling mist effect */
        .crystal-ball::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 40%, rgba(155, 77, 202, 0.1) 0%, transparent 30%),
                radial-gradient(circle at 70% 60%, rgba(74, 144, 217, 0.1) 0%, transparent 30%);
            animation: swirl 10s linear infinite;
        }

        @keyframes swirl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .crystal-text {
            position: relative;
            z-index: 1;
            padding: 1.5rem;
            text-align: center;
            font-style: italic;
            color: var(--parchment-light);
            font-size: 0.85rem;
            line-height: 1.5;
            max-height: 80%;
            overflow: hidden;
            text-shadow: 0 0 10px var(--magic-purple);
        }

        /* Typing cursor */
        .crystal-text.typing::after {
            content: '|';
            animation: blink 1s infinite;
            color: var(--magic-gold);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Rectangular version for more text */
        .crystal-ball.rectangular {
            border-radius: 12px;
            aspect-ratio: auto;
            min-height: 120px;
            max-width: 100%;
        }

        /* ═══ Quest Objectives (Todos) ═══ */
        .quest-scroll {
            background:
                url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h40v40H0z' fill='%23c4a040' fill-opacity='0.03'/%3E%3Cpath d='M20 0v40M0 20h40' stroke='%23c4a040' stroke-opacity='0.05'/%3E%3C/svg%3E"),
                linear-gradient(to bottom, var(--parchment-light), var(--parchment-dark));
            border: 2px solid var(--border-gold);
            border-radius: 4px;
            margin: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .scroll-header {
            background: var(--leather-brown);
            padding: 0.5rem 0.75rem;
            font-family: 'MedievalSharp', cursive;
            color: var(--magic-gold);
            font-size: 0.9rem;
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .objective-list {
            padding: 0.75rem;
            list-style: none;
        }

        .objective-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.4rem 0;
            font-size: 0.85rem;
            color: var(--text-dark);
            border-bottom: 1px dotted var(--border-gold);
        }

        .objective-item:last-child {
            border-bottom: none;
        }

        .objective-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .objective-item.completed {
            color: var(--leather-brown);
            opacity: 0.7;
            text-decoration: line-through;
        }

        .objective-item.in-progress {
            color: var(--leather-dark);
            font-weight: bold;
        }

        .objective-item.in-progress .objective-icon {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* ═══ Quest Log Sidebar ═══ */
        .quest-log {
            background:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E"),
                linear-gradient(to bottom, var(--leather-brown), var(--leather-dark));
            border: 3px solid var(--border-gold);
            border-radius: 8px;
            overflow: hidden;
            height: fit-content;
            max-height: calc(100vh - 150px);
            position: sticky;
            top: 1.5rem;
        }

        .quest-log-header {
            background: linear-gradient(to right, var(--wood-dark), var(--leather-dark), var(--wood-dark));
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid var(--border-gold);
        }

        .quest-log-header h3 {
            font-family: 'Uncial Antiqua', cursive;
            color: var(--magic-gold);
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .quest-log-entries {
            padding: 0.5rem;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(244, 228, 188, 0.1);
            border-left: 3px solid var(--border-gold);
            border-radius: 0 4px 4px 0;
            font-size: 0.85rem;
        }

        .log-entry.victory {
            border-left-color: var(--seal-victory);
            background: rgba(34, 139, 34, 0.1);
        }

        .log-entry.defeat {
            border-left-color: var(--seal-defeat);
            background: rgba(139, 0, 0, 0.1);
        }

        .log-entry-title {
            font-family: 'MedievalSharp', cursive;
            color: var(--parchment-light);
            margin-bottom: 0.25rem;
        }

        .log-entry-meta {
            font-size: 0.75rem;
            color: var(--parchment-dark);
            opacity: 0.8;
        }

        /* ═══ Archmage Status Panel ═══ */
        .archmage-panel {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-gold);
        }

        .archmage-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
        }

        .archmage-icon {
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .archmage-info {
            flex: 1;
        }

        .archmage-name {
            font-family: 'MedievalSharp', cursive;
            color: var(--magic-gold);
            font-size: 1rem;
        }

        .archmage-state {
            font-size: 0.8rem;
            color: var(--parchment-dark);
        }

        /* ═══ Empty State ═══ */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            font-style: italic;
            color: var(--leather-brown);
        }

        /* ═══ Loading State ═══ */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem;
            color: var(--leather-brown);
        }

        .loading-runes {
            display: flex;
            gap: 0.3rem;
        }

        .loading-runes span {
            animation: runeFloat 1s ease-in-out infinite;
            color: var(--magic-purple);
        }

        .loading-runes span:nth-child(2) { animation-delay: 0.1s; }
        .loading-runes span:nth-child(3) { animation-delay: 0.2s; }
        .loading-runes span:nth-child(4) { animation-delay: 0.3s; }
        .loading-runes span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes runeFloat {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        /* ═══ Particle Effects (Subtle Magic) ═══ */
        .magic-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--magic-gold);
            border-radius: 50%;
            animation: particleFloat 10s linear infinite;
            opacity: 0;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(720deg);
            }
        }

        /* ═══ Scrollbar Styling ═══ */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--leather-dark);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-gold);
            border-radius: 5px;
            border: 2px solid var(--leather-dark);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--magic-gold);
        }

        /* ═══ Connection Status ═══ */
        .connection-status {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: var(--leather-dark);
            border: 2px solid var(--border-gold);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 100;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--seal-active);
        }

        .connection-dot.connected {
            background: var(--seal-victory);
            animation: pulse 2s ease-in-out infinite;
        }

        /* ═══ Responsive ═══ */
        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .quest-log {
                position: static;
                max-height: 400px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header::before,
            .header::after {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Magical Particle Background -->
    <div class="magic-particles" id="particles"></div>

    <!-- Header Banner -->
    <header class="header">
        <h1>Arcane Quest Monitor</h1>
        <p class="subtitle">Scrying Portal for the Archmage's Operations</p>
    </header>

    <div class="main-container">
        <!-- Main Quest Area -->
        <main class="quests-area">
            <div class="fantasy-card rune-border">
                <span class="card-corner-bl">◆</span>
                <span class="card-corner-br">◆</span>
                <div class="card-header">
                    <span class="icon">⚔️</span>
                    <h2>Active Quests</h2>
                </div>
                <div class="card-body">
                    <div class="quests-grid" id="quests-container">
                        <div class="loading">
                            <span>Consulting the Oracle</span>
                            <div class="loading-runes">
                                <span>ᚱ</span>
                                <span>ᚢ</span>
                                <span>ᚾ</span>
                                <span>ᛖ</span>
                                <span>ᛊ</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Quest Log Sidebar -->
        <aside class="quest-log">
            <div class="quest-log-header">
                <h3>📜 Quest Log</h3>
            </div>
            <div class="quest-log-entries" id="quest-log">
                <div class="log-entry">
                    <div class="log-entry-title">Awaiting Quests...</div>
                    <div class="log-entry-meta">The realm is at peace</div>
                </div>
            </div>

            <!-- Archmage Status -->
            <div class="archmage-panel">
                <div class="archmage-status">
                    <div class="archmage-icon">🧙</div>
                    <div class="archmage-info">
                        <div class="archmage-name">The Archmage</div>
                        <div class="archmage-state" id="archmage-state">Meditating...</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Connection Status -->
    <div class="connection-status">
        <div class="connection-dot" id="connection-dot"></div>
        <span id="connection-text">Connecting to the Aether...</span>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════════════════
           FANTASY QUEST MONITOR - JavaScript Logic

           SOUND EFFECT NOTES (for future implementation):
           - Quest Started: mystical_whoosh.mp3 - ethereal wind sound
           - Spell Cast: spell_cast.mp3 - magical chime with sparkle
           - Spell Complete: spell_complete.mp3 - soft bell tone
           - Victory: victory_fanfare.mp3 - triumphant orchestral hit
           - Defeat: defeat_sound.mp3 - ominous low drum
           - New Objective: scroll_unfurl.mp3 - parchment rustling
           - Objective Complete: objective_complete.mp3 - coin/gem pickup sound

           Implementation example:
           const sounds = {
               spellCast: new Audio('/sounds/spell_cast.mp3'),
               victory: new Audio('/sounds/victory_fanfare.mp3')
           };
           sounds.spellCast.volume = 0.3;
           sounds.spellCast.play();
           ═══════════════════════════════════════════════════════════════════════════ */

        const API_BASE = 'http://localhost:8081';
        const POLL_INTERVAL = 1000; // 1 second

        // Spell (Tool) mappings
        const SPELL_MAPPINGS = {
            'Read': { name: 'Scrying', icon: '👁️', class: 'spell-scrying' },
            'Write': { name: 'Inscription', icon: '✒️', class: 'spell-inscription' },
            'Edit': { name: 'Transmutation', icon: '⚗️', class: 'spell-transmutation' },
            'Bash': { name: 'Conjuration', icon: '🔮', class: 'spell-conjuration' },
            'Grep': { name: 'Divination', icon: '🔍', class: 'spell-divination' },
            'Glob': { name: 'Seeking', icon: '✨', class: 'spell-seeking' },
            'WebFetch': { name: 'Far Sight', icon: '🌐', class: 'spell-scrying' },
            'TodoWrite': { name: 'Chronicle', icon: '📜', class: 'spell-inscription' },
            'LSP': { name: 'Arcane Sense', icon: '🎯', class: 'spell-divination' }
        };

        // Status mappings
        const STATUS_MAPPINGS = {
            'running': { text: 'Quest Active', seal: 'quest-active', icon: '⚔️' },
            'completed': { text: 'Victory!', seal: 'victory', icon: '🏆' },
            'error': { text: 'Defeat', seal: 'defeat', icon: '💀' },
            'aborted': { text: 'Retreat', seal: 'defeat', icon: '🏃' }
        };

        // Objective (Todo) status icons
        const OBJECTIVE_ICONS = {
            'pending': '○',
            'in_progress': '◐',
            'completed': '●'
        };

        // State
        let completedQuests = [];
        let isConnected = false;

        // Create magical particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (8 + Math.random() * 4) + 's';

                // Randomize colors
                const colors = ['#ffd700', '#9b4dca', '#4a90d9', '#4ade80'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];

                container.appendChild(particle);
            }
        }

        // Format duration
        function formatDuration(ms) {
            if (!ms) return '0s';
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            }
            return `${seconds}s`;
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        // Truncate text
        function truncate(text, maxLength = 100) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        // Get spell info for a tool
        function getSpellInfo(toolName) {
            return SPELL_MAPPINGS[toolName] || {
                name: toolName,
                icon: '✧',
                class: 'spell-scrying'
            };
        }

        // Render a single quest card
        function renderQuestCard(request) {
            const status = STATUS_MAPPINGS[request.status] || STATUS_MAPPINGS['running'];
            const duration = request.startTime ? Date.now() - request.startTime : 0;

            // Calculate progress (rough estimate based on todos or just use time)
            const completedTodos = (request.todos || []).filter(t => t.status === 'completed').length;
            const totalTodos = (request.todos || []).length || 1;
            const todoProgress = Math.round((completedTodos / totalTodos) * 100);

            // Mana progress (based on streaming text length, max at 2000 chars)
            const streamingLength = (request.streamingText || '').length;
            const manaProgress = Math.min(100, Math.round((streamingLength / 2000) * 100));

            return `
                <div class="quest-card fantasy-card">
                    <span class="card-corner-bl">◆</span>
                    <span class="card-corner-br">◆</span>

                    <!-- Wax Seal Status -->
                    <div class="wax-seal ${status.seal}">${status.icon}</div>

                    <!-- Quest Header -->
                    <div class="quest-header">
                        <div class="quest-title">${truncate(request.message || 'Unnamed Quest', 60)}</div>
                        <div class="quest-id">${request.requestId || 'Unknown'}</div>
                        <div class="quest-meta">
                            <span>⏱️ ${formatDuration(duration)}</span>
                            <span>📍 ${truncate(request.workingDirectory || '/realm', 30)}</span>
                        </div>
                    </div>

                    <!-- Health/Mana Bars -->
                    <div class="progress-bars">
                        <div class="bar-container">
                            <div class="bar-label">
                                <span>Quest Progress</span>
                                <span>${todoProgress}%</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill health" style="width: ${todoProgress}%"></div>
                            </div>
                        </div>
                        <div class="bar-container">
                            <div class="bar-label">
                                <span>Arcane Energy</span>
                                <span>${manaProgress}%</span>
                            </div>
                            <div class="bar-track">
                                <div class="bar-fill mana" style="width: ${manaProgress}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Spellbook (Tools) -->
                    ${renderSpellbook(request.tools || [])}

                    <!-- Quest Objectives (Todos) -->
                    ${renderObjectives(request.todos || [])}

                    <!-- Crystal Ball (Streaming Text) -->
                    ${renderCrystalBall(request.streamingText, request.status)}
                </div>
            `;
        }

        // Render spellbook (tools)
        function renderSpellbook(tools) {
            if (!tools || tools.length === 0) {
                return '';
            }

            const spellTags = tools.map(tool => {
                const spell = getSpellInfo(tool.name);
                const isCasting = tool.status === 'running';
                const statusIcon = isCasting ? '◐' : '✓';
                const duration = tool.duration ? ` (${formatDuration(tool.duration)})` : '';

                return `
                    <span class="spell-tag ${spell.class} ${isCasting ? 'casting' : ''}">
                        <span class="spell-icon">${spell.icon}</span>
                        <span>${spell.name}</span>
                        <span class="spell-status">${statusIcon}${duration}</span>
                    </span>
                `;
            }).join('');

            return `
                <div class="spellbook">
                    <div class="spellbook-title">
                        <span>📖</span>
                        <span>Spells Cast</span>
                    </div>
                    <div class="spells-list">
                        ${spellTags}
                    </div>
                </div>
            `;
        }

        // Render quest objectives (todos)
        function renderObjectives(todos) {
            if (!todos || todos.length === 0) {
                return '';
            }

            const objectiveItems = todos.map(todo => {
                const icon = OBJECTIVE_ICONS[todo.status] || '○';
                const statusClass = todo.status === 'completed' ? 'completed' :
                                   todo.status === 'in_progress' ? 'in-progress' : '';

                return `
                    <li class="objective-item ${statusClass}">
                        <span class="objective-icon">${icon}</span>
                        <span>${truncate(todo.content || todo.activeForm || 'Unknown objective', 50)}</span>
                    </li>
                `;
            }).join('');

            return `
                <div class="quest-scroll">
                    <div class="scroll-header">
                        <span>📋</span>
                        <span>Quest Objectives</span>
                    </div>
                    <ul class="objective-list">
                        ${objectiveItems}
                    </ul>
                </div>
            `;
        }

        // Render crystal ball (streaming output)
        function renderCrystalBall(streamingText, status) {
            if (!streamingText && status !== 'running') {
                return '';
            }

            const isTyping = status === 'running';
            const displayText = truncate(streamingText || 'The mists swirl, awaiting visions...', 200);

            return `
                <div class="crystal-ball-container">
                    <div class="crystal-ball rectangular">
                        <div class="crystal-text ${isTyping ? 'typing' : ''}">
                            ${displayText}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render quest log entry
        function renderQuestLogEntry(request) {
            const status = STATUS_MAPPINGS[request.status] || STATUS_MAPPINGS['completed'];
            const duration = request.startTime ? Date.now() - request.startTime : 0;
            const logClass = request.status === 'completed' ? 'victory' :
                            request.status === 'error' ? 'defeat' : '';

            return `
                <div class="log-entry ${logClass}">
                    <div class="log-entry-title">${status.icon} ${truncate(request.message || 'Quest', 30)}</div>
                    <div class="log-entry-meta">
                        ${status.text} | ${formatDuration(duration)} | ${formatTime(request.startTime || Date.now())}
                    </div>
                </div>
            `;
        }

        // Update archmage status
        function updateArchmageStatus(requests) {
            const archmageState = document.getElementById('archmage-state');
            const activeCount = requests.filter(r => r.status === 'running').length;

            if (activeCount === 0) {
                archmageState.textContent = 'Meditating in the tower...';
            } else if (activeCount === 1) {
                archmageState.textContent = 'Directing a quest...';
            } else {
                archmageState.textContent = `Orchestrating ${activeCount} quests...`;
            }
        }

        // Update connection status
        function updateConnectionStatus(connected, message) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');

            if (connected) {
                dot.classList.add('connected');
                text.textContent = message || 'Connected to the Aether';
            } else {
                dot.classList.remove('connected');
                text.textContent = message || 'Lost in the Void...';
            }

            isConnected = connected;
        }

        // Fetch and render requests
        async function fetchRequests() {
            try {
                const response = await fetch(`${API_BASE}/api/chat/requests`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                updateConnectionStatus(true, 'Aetheric link established');

                const container = document.getElementById('quests-container');
                const questLog = document.getElementById('quest-log');

                // Get all requests
                const allRequests = Object.entries(data.requests || {}).map(([id, req]) => ({
                    requestId: id,
                    ...req
                }));

                // Separate active and completed
                const activeRequests = allRequests.filter(r => r.status === 'running');
                const finishedRequests = allRequests.filter(r => r.status !== 'running');

                // Track newly completed for sound effects
                // SOUND EFFECT NOTE: Play victory/defeat sound here
                // finishedRequests.forEach(req => {
                //     if (!completedQuests.includes(req.requestId)) {
                //         if (req.status === 'completed') sounds.victory.play();
                //         else sounds.defeat.play();
                //     }
                // });
                completedQuests = finishedRequests.map(r => r.requestId);

                // Render active quests
                if (activeRequests.length === 0 && finishedRequests.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🏰</div>
                            <p>No quests are currently active.</p>
                            <p style="margin-top: 0.5rem; font-size: 0.9rem;">The realm awaits your command...</p>
                        </div>
                    `;
                } else if (activeRequests.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🌙</div>
                            <p>All quests have concluded.</p>
                            <p style="margin-top: 0.5rem; font-size: 0.9rem;">Check the Quest Log for recent adventures.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = activeRequests.map(renderQuestCard).join('');
                }

                // Render quest log (recent completed quests)
                if (finishedRequests.length > 0) {
                    // Sort by most recent first
                    finishedRequests.sort((a, b) => (b.startTime || 0) - (a.startTime || 0));
                    questLog.innerHTML = finishedRequests.slice(0, 10).map(renderQuestLogEntry).join('');
                } else {
                    questLog.innerHTML = `
                        <div class="log-entry">
                            <div class="log-entry-title">Awaiting Quests...</div>
                            <div class="log-entry-meta">The realm is at peace</div>
                        </div>
                    `;
                }

                // Update archmage
                updateArchmageStatus(activeRequests);

            } catch (error) {
                console.error('Failed to fetch requests:', error);
                updateConnectionStatus(false, 'Cannot reach the Oracle...');

                // Show error in container if first load
                const container = document.getElementById('quests-container');
                if (container.querySelector('.loading')) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">💀</div>
                            <p>The Aetheric connection has been severed.</p>
                            <p style="margin-top: 0.5rem; font-size: 0.9rem;">
                                Ensure the Oracle (proxy server) is running on port 8081.
                            </p>
                        </div>
                    `;
                }
            }
        }

        // Initialize
        function init() {
            createParticles();
            fetchRequests();
            setInterval(fetchRequests, POLL_INTERVAL);
        }

        // Start when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
