<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Realm - Chat API Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 30%, #4a2c5a 60%, #2d1b4e 100%);
            min-height: 100vh;
            color: #e8d5b7;
            overflow: hidden;
        }

        /* Sky with stars and aurora */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .aurora {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg,
                rgba(100, 200, 100, 0.1) 0%,
                rgba(100, 150, 200, 0.05) 50%,
                transparent 100%);
            animation: aurora-wave 8s ease-in-out infinite;
        }

        @keyframes aurora-wave {
            0%, 100% { opacity: 0.3; transform: skewX(-5deg); }
            50% { opacity: 0.6; transform: skewX(5deg); }
        }

        /* Mountains in background */
        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            z-index: 1;
        }

        .mountain {
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 10, 50, 0.8);
            border-bottom: 2px solid #8b4513;
            box-shadow: 0 4px 20px rgba(139, 69, 19, 0.3);
        }

        h1 {
            font-size: 1.8em;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.5);
            letter-spacing: 2px;
        }

        h1::before {
            content: '🐉';
            margin-right: 10px;
        }

        .realm-stats {
            display: flex;
            gap: 25px;
        }

        .stat {
            text-align: center;
            padding: 8px 15px;
            background: rgba(139, 69, 19, 0.3);
            border-radius: 8px;
            border: 1px solid #8b4513;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffa500;
        }

        .stat-label {
            font-size: 0.75em;
            color: #c4a35a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Main realm area */
        .realm {
            position: relative;
            z-index: 5;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            height: calc(100vh - 80px);
        }

        /* Dragon nest container */
        .dragon-nests {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            padding: 20px;
        }

        /* Individual dragon */
        .dragon-nest {
            position: relative;
            width: 320px;
            min-height: 400px;
            background: rgba(30, 15, 45, 0.9);
            border-radius: 20px;
            border: 3px solid #8b4513;
            padding: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .dragon-nest::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(180deg, rgba(139, 69, 19, 0.2), transparent);
            pointer-events: none;
        }

        .dragon-nest.flying {
            animation: hover-flight 3s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(255, 100, 0, 0.4);
        }

        .dragon-nest.resting {
            box-shadow: 0 10px 30px rgba(0, 200, 100, 0.3);
        }

        .dragon-nest.wounded {
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
            border-color: #ff4444;
        }

        @keyframes hover-flight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Dragon header */
        .dragon-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .dragon-name {
            font-size: 0.8em;
            color: #c4a35a;
            font-family: monospace;
        }

        .dragon-age {
            font-size: 0.75em;
            color: #888;
            padding: 3px 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        /* Dragon body - SVG container */
        .dragon-body {
            position: relative;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dragon-svg {
            width: 200px;
            height: 150px;
        }

        /* Dragon wing flap animation */
        .dragon-wing {
            transform-origin: center;
            animation: wing-flap 0.5s ease-in-out infinite;
        }

        .dragon-wing.left {
            animation-delay: 0s;
        }

        .dragon-wing.right {
            animation-delay: 0.1s;
        }

        .dragon-nest.resting .dragon-wing {
            animation: wing-fold 2s ease-in-out infinite;
        }

        @keyframes wing-flap {
            0%, 100% { transform: rotate(-20deg) scaleY(1); }
            50% { transform: rotate(-5deg) scaleY(0.9); }
        }

        @keyframes wing-fold {
            0%, 100% { transform: rotate(-30deg) scaleY(0.7); }
            50% { transform: rotate(-25deg) scaleY(0.75); }
        }

        /* Fire breath */
        .fire-breath {
            position: absolute;
            left: 60%;
            top: 30%;
            width: 80px;
            height: 30px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .dragon-nest.breathing-fire .fire-breath {
            opacity: 1;
            animation: fire-flicker 0.1s infinite;
        }

        @keyframes fire-flicker {
            0%, 100% { transform: scaleX(1) scaleY(1); }
            50% { transform: scaleX(1.1) scaleY(0.9); }
        }

        .fire-particle {
            position: absolute;
            border-radius: 50%;
            animation: fire-particle 0.5s ease-out forwards;
        }

        @keyframes fire-particle {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            100% { transform: translateX(60px) scale(0.3); opacity: 0; }
        }

        /* Dragon status */
        .dragon-status {
            text-align: center;
            margin: 15px 0;
            padding: 8px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dragon-status.flying {
            background: linear-gradient(90deg, rgba(255,100,0,0.3), rgba(255,200,0,0.3));
            color: #ffa500;
        }

        .dragon-status.resting {
            background: rgba(0, 200, 100, 0.2);
            color: #4ade80;
        }

        .dragon-status.wounded {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
        }

        /* Abilities (Tools) */
        .abilities-section {
            margin-top: 15px;
        }

        .abilities-title {
            font-size: 0.85em;
            color: #c4a35a;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .abilities-title::before {
            content: '⚔️';
        }

        .abilities-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .ability {
            position: relative;
            padding: 10px 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .ability.active {
            border-color: #ffa500;
            background: rgba(255, 165, 0, 0.2);
            animation: ability-glow 1s ease-in-out infinite;
        }

        .ability.used {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        @keyframes ability-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 165, 0, 0.5); }
            50% { box-shadow: 0 0 15px rgba(255, 165, 0, 0.8); }
        }

        .ability-icon {
            font-size: 1.5em;
            display: block;
            margin-bottom: 5px;
        }

        .ability-name {
            font-size: 0.65em;
            color: #aaa;
            text-transform: uppercase;
        }

        .ability-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #8b4513;
            color: #ffd700;
            font-size: 0.7em;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Dragon's hoard (message) */
        .dragon-hoard {
            margin-top: 15px;
            padding: 10px;
            background: rgba(139, 69, 19, 0.2);
            border-radius: 8px;
            border-left: 3px solid #ffd700;
        }

        .hoard-title {
            font-size: 0.75em;
            color: #c4a35a;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .hoard-title::before {
            content: '💎';
        }

        .hoard-message {
            font-size: 0.85em;
            color: #e8d5b7;
            font-style: italic;
            line-height: 1.4;
        }

        /* Streaming output as dragon's roar */
        .dragon-roar {
            margin-top: 10px;
            max-height: 60px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.75em;
            color: #888;
        }

        .dragon-roar.active {
            border: 1px solid #ffa500;
        }

        .dragon-roar.active::after {
            content: '█';
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Smoke/breath indicator */
        .smoke-trail {
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.5;
        }

        .smoke-puff {
            width: 8px;
            height: 8px;
            background: rgba(150, 150, 150, 0.5);
            border-radius: 50%;
            animation: smoke-rise 2s ease-out infinite;
            position: absolute;
        }

        @keyframes smoke-rise {
            0% { transform: translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateY(-30px) scale(2); opacity: 0; }
        }

        /* Empty state */
        .empty-realm {
            text-align: center;
            padding: 100px 20px;
            color: #666;
        }

        .empty-realm h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #8b4513;
        }

        .empty-realm p {
            font-size: 1.1em;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Loading eggs */
        .dragon-egg {
            width: 60px;
            height: 80px;
            margin: 40px auto;
            background: radial-gradient(ellipse at 30% 30%, #c4a35a, #8b4513);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: egg-wobble 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        @keyframes egg-wobble {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .egg-crack {
            animation: egg-crack 0.5s ease-out forwards;
        }

        @keyframes egg-crack {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Hat badges as dragon accessories */
        .dragon-accessories {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .accessory {
            padding: 3px 8px;
            background: rgba(139, 69, 19, 0.5);
            border-radius: 10px;
            font-size: 0.7em;
            color: #ffd700;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #8b4513;
            border-radius: 4px;
        }

        /* Source badge */
        .source-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .source-badge.websocket {
            background: rgba(147, 51, 234, 0.3);
            color: #a855f7;
        }

        .source-badge.rest {
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="sky" id="sky"></div>
    <div class="aurora"></div>
    <div class="mountains" id="mountains"></div>

    <header>
        <h1>Dragon Realm</h1>
        <div class="realm-stats">
            <div class="stat">
                <div class="stat-value" id="dragon-count">0</div>
                <div class="stat-label">Dragons</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="flying-count">0</div>
                <div class="stat-label">Flying</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="abilities-used">0</div>
                <div class="stat-label">Abilities Used</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="fire-breaths">0</div>
                <div class="stat-label">Fire Breaths</div>
            </div>
        </div>
    </header>

    <div class="realm">
        <div class="dragon-nests" id="dragon-nests">
            <div class="empty-realm">
                <h2>The Realm Awaits...</h2>
                <div class="dragon-egg"></div>
                <p>Dragons will emerge when requests flow through the realm. Each request summons a dragon, and their abilities manifest as the tools they wield.</p>
            </div>
        </div>
    </div>

    <script>
        // Tool to Dragon Ability mapping
        const ABILITY_MAP = {
            'Read': { icon: '👁️', name: 'Vision', element: 'air' },
            'Write': { icon: '✍️', name: 'Inscribe', element: 'earth' },
            'Edit': { icon: '🔧', name: 'Shape', element: 'earth' },
            'Bash': { icon: '🔥', name: 'Fire Breath', element: 'fire' },
            'Grep': { icon: '🔍', name: 'Hunt', element: 'air' },
            'Glob': { icon: '🌐', name: 'Survey', element: 'air' },
            'Task': { icon: '👥', name: 'Summon', element: 'spirit' },
            'WebFetch': { icon: '🌊', name: 'Dive', element: 'water' },
            'WebSearch': { icon: '⚡', name: 'Lightning', element: 'storm' },
            'TodoWrite': { icon: '📜', name: 'Decree', element: 'spirit' },
            'AskUserQuestion': { icon: '💬', name: 'Speak', element: 'spirit' },
            'EnterPlanMode': { icon: '🧠', name: 'Strategize', element: 'spirit' },
            'ExitPlanMode': { icon: '⚔️', name: 'Execute', element: 'fire' },
            'NotebookEdit': { icon: '📖', name: 'Chronicle', element: 'earth' },
            'Skill': { icon: '✨', name: 'Magic', element: 'spirit' }
        };

        // Dragon color palettes by element
        const ELEMENT_COLORS = {
            fire: { primary: '#ff6b35', secondary: '#ff9f1c', accent: '#ffcc00' },
            water: { primary: '#4361ee', secondary: '#4cc9f0', accent: '#72efdd' },
            earth: { primary: '#6b8e23', secondary: '#9acd32', accent: '#adff2f' },
            air: { primary: '#b8c0ff', secondary: '#e0aaff', accent: '#ffc8dd' },
            storm: { primary: '#7b2cbf', secondary: '#9d4edd', accent: '#c77dff' },
            spirit: { primary: '#ffd700', secondary: '#ffaa00', accent: '#ff8800' }
        };

        // State
        let dragons = new Map();
        let totalAbilitiesUsed = 0;
        let fireBreaths = 0;

        // Initialize background
        function initBackground() {
            const sky = document.getElementById('sky');
            const mountains = document.getElementById('mountains');

            // Create stars
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 60 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                sky.appendChild(star);
            }

            // Create mountains
            const mountainData = [
                { left: -5, width: 300, height: 200, color: '#1a0a2e' },
                { left: 15, width: 400, height: 280, color: '#2d1b4e' },
                { left: 40, width: 350, height: 220, color: '#1a0a2e' },
                { left: 60, width: 450, height: 300, color: '#2d1b4e' },
                { left: 85, width: 300, height: 240, color: '#1a0a2e' }
            ];

            mountainData.forEach(m => {
                const mountain = document.createElement('div');
                mountain.className = 'mountain';
                mountain.style.left = m.left + '%';
                mountain.style.borderWidth = `0 ${m.width/2}px ${m.height}px ${m.width/2}px`;
                mountain.style.borderColor = `transparent transparent ${m.color} transparent`;
                mountains.appendChild(mountain);
            });
        }

        // Generate dragon SVG
        function generateDragonSVG(dragon, dominantElement) {
            const colors = ELEMENT_COLORS[dominantElement] || ELEMENT_COLORS.fire;
            const isFlying = dragon.status === 'running';

            return `
                <svg class="dragon-svg" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dragon body -->
                    <defs>
                        <radialGradient id="bodyGrad_${dragon.id}" cx="50%" cy="50%">
                            <stop offset="0%" stop-color="${colors.primary}"/>
                            <stop offset="100%" stop-color="${colors.secondary}"/>
                        </radialGradient>
                        <filter id="glow_${dragon.id}">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>

                    <!-- Left wing -->
                    <g class="dragon-wing left" transform="translate(70, 50)">
                        <path d="M0,0 Q-30,-40 -50,-20 Q-40,10 -20,20 Q-10,10 0,0"
                              fill="${colors.secondary}" opacity="0.8"/>
                        <path d="M0,0 Q-20,-25 -35,-10 Q-25,5 -10,15 Q-5,8 0,0"
                              fill="${colors.primary}" opacity="0.9"/>
                    </g>

                    <!-- Right wing -->
                    <g class="dragon-wing right" transform="translate(130, 50)">
                        <path d="M0,0 Q30,-40 50,-20 Q40,10 20,20 Q10,10 0,0"
                              fill="${colors.secondary}" opacity="0.8"/>
                        <path d="M0,0 Q20,-25 35,-10 Q25,5 10,15 Q5,8 0,0"
                              fill="${colors.primary}" opacity="0.9"/>
                    </g>

                    <!-- Body -->
                    <ellipse cx="100" cy="75" rx="35" ry="25"
                             fill="url(#bodyGrad_${dragon.id})"
                             filter="url(#glow_${dragon.id})"/>

                    <!-- Tail -->
                    <path d="M65,80 Q40,90 20,110 Q15,120 25,115 Q45,95 65,85"
                          fill="${colors.primary}" stroke="${colors.secondary}" stroke-width="2"/>

                    <!-- Neck -->
                    <path d="M125,65 Q145,55 155,40"
                          stroke="${colors.primary}" stroke-width="12" fill="none"
                          stroke-linecap="round"/>

                    <!-- Head -->
                    <ellipse cx="160" cy="35" rx="18" ry="12" fill="${colors.primary}"/>

                    <!-- Snout -->
                    <path d="M170,35 L185,32 L185,38 Z" fill="${colors.secondary}"/>

                    <!-- Eye -->
                    <circle cx="165" cy="32" r="4" fill="${colors.accent}"/>
                    <circle cx="166" cy="31" r="2" fill="#000"/>

                    <!-- Horns -->
                    <path d="M155,25 Q150,15 158,10" stroke="${colors.accent}" stroke-width="3" fill="none"/>
                    <path d="M165,25 Q170,12 162,8" stroke="${colors.accent}" stroke-width="3" fill="none"/>

                    <!-- Spikes -->
                    <path d="M90,52 L95,42 L100,52 M105,50 L110,38 L115,50 M120,52 L125,40 L130,52"
                          fill="${colors.accent}"/>

                    <!-- Legs -->
                    <path d="M85,95 Q80,110 75,120 Q78,122 82,118 Q85,108 90,95" fill="${colors.primary}"/>
                    <path d="M115,95 Q120,110 125,120 Q122,122 118,118 Q115,108 110,95" fill="${colors.primary}"/>

                    <!-- Belly scales -->
                    <ellipse cx="100" cy="82" rx="20" ry="10" fill="${colors.accent}" opacity="0.3"/>
                </svg>
            `;
        }

        // Create fire breath effect
        function createFireBreath(nestElement) {
            const fireContainer = nestElement.querySelector('.fire-breath');
            if (!fireContainer) return;

            // Add random fire particles
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'fire-particle';
                particle.style.left = (Math.random() * 20) + 'px';
                particle.style.top = (Math.random() * 30) + 'px';
                particle.style.width = (Math.random() * 10 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = `radial-gradient(circle, #ffcc00, #ff6600, #ff0000)`;
                particle.style.animationDelay = (Math.random() * 0.3) + 's';
                fireContainer.appendChild(particle);

                // Remove particle after animation
                setTimeout(() => particle.remove(), 500);
            }
        }

        // Get dominant element from tools
        function getDominantElement(tools) {
            const elementCounts = {};
            tools.forEach(tool => {
                const ability = ABILITY_MAP[tool.name];
                if (ability) {
                    elementCounts[ability.element] = (elementCounts[ability.element] || 0) + 1;
                }
            });

            let dominant = 'fire';
            let maxCount = 0;
            for (const [element, count] of Object.entries(elementCounts)) {
                if (count > maxCount) {
                    maxCount = count;
                    dominant = element;
                }
            }
            return dominant;
        }

        // Render a dragon
        function renderDragon(request) {
            const dominantElement = getDominantElement(request.tools || []);
            const statusClass = request.status === 'running' ? 'flying' :
                               request.status === 'completed' ? 'resting' : 'wounded';

            // Check if any Bash tools are active (fire breathing)
            const isBreathingFire = (request.tools || []).some(t =>
                t.name === 'Bash' && t.status === 'running'
            );

            // Count abilities by type
            const abilityCounts = {};
            (request.tools || []).forEach(tool => {
                abilityCounts[tool.name] = (abilityCounts[tool.name] || 0) + 1;
            });

            // Duration
            const duration = request.duration ?
                (request.duration / 1000).toFixed(1) + 's' :
                request.startTime ?
                    ((Date.now() - new Date(request.startTime).getTime()) / 1000).toFixed(1) + 's' :
                    '?';

            // Source badge
            const sourceClass = request.source === 'websocket' ? 'websocket' : 'rest';
            const sourceLabel = request.source === 'websocket' ? 'WS' : 'API';

            // Truncate ID
            const shortId = request.id.length > 20 ?
                request.id.slice(0, 8) + '...' + request.id.slice(-8) : request.id;

            // Build abilities HTML
            let abilitiesHTML = '';
            Object.keys(ABILITY_MAP).forEach(toolName => {
                const ability = ABILITY_MAP[toolName];
                const count = abilityCounts[toolName] || 0;
                const isActive = (request.tools || []).some(t =>
                    t.name === toolName && t.status === 'running'
                );
                const wasUsed = count > 0;

                const classes = ['ability'];
                if (isActive) classes.push('active');
                else if (wasUsed) classes.push('used');

                abilitiesHTML += `
                    <div class="${classes.join(' ')}" title="${toolName}">
                        <span class="ability-icon">${ability.icon}</span>
                        <span class="ability-name">${ability.name}</span>
                        ${count > 0 ? `<span class="ability-count">${count}</span>` : ''}
                    </div>
                `;
            });

            // Hats as accessories
            let accessoriesHTML = '';
            if (request.hatIds && request.hatIds.length > 0) {
                accessoriesHTML = `
                    <div class="dragon-accessories">
                        ${request.hatIds.map(h => `<span class="accessory">🎭 ${h}</span>`).join('')}
                    </div>
                `;
            }

            // Status text
            const statusText = request.status === 'running' ? '🐉 Soaring Through the Realm' :
                              request.status === 'completed' ? '😴 Resting in the Nest' :
                              request.status === 'error' ? '🩹 Wounded in Battle' :
                              '💀 Fallen';

            return `
                <div class="dragon-nest ${statusClass} ${isBreathingFire ? 'breathing-fire' : ''}"
                     data-id="${request.id}">

                    <div class="smoke-trail">
                        <div class="smoke-puff" style="animation-delay: 0s;"></div>
                        <div class="smoke-puff" style="animation-delay: 0.5s; left: 10px;"></div>
                        <div class="smoke-puff" style="animation-delay: 1s; left: -5px;"></div>
                    </div>

                    <div class="dragon-header">
                        <div>
                            <div class="dragon-name">${shortId}</div>
                            <span class="source-badge ${sourceClass}">${sourceLabel}</span>
                        </div>
                        <div class="dragon-age">${duration}</div>
                    </div>

                    <div class="dragon-body">
                        ${generateDragonSVG(request, dominantElement)}
                        <div class="fire-breath"></div>
                    </div>

                    <div class="dragon-status ${statusClass}">${statusText}</div>

                    <div class="abilities-section">
                        <div class="abilities-title">Dragon Abilities</div>
                        <div class="abilities-grid">
                            ${abilitiesHTML}
                        </div>
                    </div>

                    ${request.message ? `
                        <div class="dragon-hoard">
                            <div class="hoard-title">Quest (Hoard)</div>
                            <div class="hoard-message">${truncateText(request.message, 100)}</div>
                        </div>
                    ` : ''}

                    ${request.streamingText ? `
                        <div class="dragon-roar ${request.status === 'running' ? 'active' : ''}">
                            ${truncateText(request.streamingText, 150)}
                        </div>
                    ` : ''}

                    ${accessoriesHTML}
                </div>
            `;
        }

        // Truncate text helper
        function truncateText(text, maxLen) {
            if (!text) return '';
            const clean = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return clean.length > maxLen ? clean.slice(0, maxLen) + '...' : clean;
        }

        // Update display
        function updateDisplay(requests) {
            const container = document.getElementById('dragon-nests');

            if (!requests || requests.length === 0) {
                container.innerHTML = `
                    <div class="empty-realm">
                        <h2>The Realm Awaits...</h2>
                        <div class="dragon-egg"></div>
                        <p>Dragons will emerge when requests flow through the realm. Each request summons a dragon, and their abilities manifest as the tools they wield.</p>
                    </div>
                `;
                return;
            }

            // Map requests to dragons
            const dragonHTML = requests.map(req => renderDragon(req)).join('');
            container.innerHTML = dragonHTML;

            // Trigger fire breath animation for active Bash tools
            requests.forEach(req => {
                if (req.status === 'running') {
                    const nest = container.querySelector(`[data-id="${req.id}"]`);
                    if (nest && nest.classList.contains('breathing-fire')) {
                        createFireBreath(nest);
                    }
                }
            });

            // Update stats
            document.getElementById('dragon-count').textContent = requests.length;
            document.getElementById('flying-count').textContent =
                requests.filter(r => r.status === 'running').length;

            let total = 0;
            let bashCount = 0;
            requests.forEach(r => {
                total += (r.tools || []).length;
                bashCount += (r.tools || []).filter(t => t.name === 'Bash').length;
            });
            document.getElementById('abilities-used').textContent = total;
            document.getElementById('fire-breaths').textContent = bashCount;
        }

        // Fetch data from API
        async function fetchData() {
            try {
                const response = await fetch('http://localhost:8081/api/chat/requests');
                const data = await response.json();

                // Transform data
                const requests = (data.requests || []).map(req => ({
                    id: req.requestId,
                    status: req.status,
                    message: req.message,
                    tools: req.tools || [],
                    streamingText: req.streamingText,
                    startTime: req.startTime,
                    duration: req.duration,
                    source: req.source,
                    hatIds: req.hatIds || [],
                    tabId: req.tabId
                }));

                updateDisplay(requests);
            } catch (error) {
                console.error('Failed to fetch dragon realm data:', error);
            }
        }

        // Initialize
        initBackground();
        fetchData();
        setInterval(fetchData, 1000);

        // Fire breath animation loop for active dragons
        setInterval(() => {
            document.querySelectorAll('.dragon-nest.breathing-fire').forEach(nest => {
                createFireBreath(nest);
            });
        }, 300);
    </script>
</body>
</html>
