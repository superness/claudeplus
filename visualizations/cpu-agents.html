<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Agents - Sci-Fi Agent Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050510;
            min-height: 100vh;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            overflow: hidden;
        }

        /* Circuit board background */
        .circuit-bg {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0,255,200,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,255,200,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Ambient glow */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,180,255,0.15) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(60px);
            animation: ambientDrift 20s ease-in-out infinite;
        }

        @keyframes ambientDrift {
            0%, 100% { transform: translate(-50%, -50%); }
            25% { transform: translate(-30%, -60%); }
            50% { transform: translate(-70%, -40%); }
            75% { transform: translate(-40%, -30%); }
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            background: linear-gradient(180deg, rgba(5,5,16,0.95) 0%, transparent 100%);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            color: #00ffc8;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,255,200,0.5);
        }

        .status-bar {
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            color: #666;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .status-dot.online {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main canvas area */
        .canvas-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #agentCanvas {
            width: 100%;
            height: 100%;
        }

        /* CPU Chip Styles */
        .cpu-chip {
            position: absolute;
            width: 120px;
            height: 120px;
            background: linear-gradient(145deg, #1a1a2e 0%, #0a0a15 100%);
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow:
                0 0 0 1px rgba(0,255,200,0.1),
                inset 0 0 20px rgba(0,0,0,0.5),
                0 10px 40px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cpu-chip.active {
            border-color: #00ffc8;
            box-shadow:
                0 0 0 1px rgba(0,255,200,0.3),
                0 0 30px rgba(0,255,200,0.3),
                inset 0 0 20px rgba(0,255,200,0.1),
                0 10px 40px rgba(0,0,0,0.5);
        }

        .cpu-chip.thinking {
            animation: chipThinking 1s ease-in-out infinite;
        }

        @keyframes chipThinking {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Chip internal pattern */
        .chip-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #0f0f1a 0%, #050508 100%);
            border: 1px solid #444;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chip-core::before {
            content: '';
            position: absolute;
            inset: 4px;
            background:
                repeating-linear-gradient(0deg, #222 0px, #222 2px, transparent 2px, transparent 6px),
                repeating-linear-gradient(90deg, #222 0px, #222 2px, transparent 2px, transparent 6px);
            opacity: 0.5;
        }

        .chip-icon {
            font-size: 1.5rem;
            z-index: 1;
            filter: grayscale(50%);
            transition: filter 0.3s;
        }

        .cpu-chip.active .chip-icon {
            filter: grayscale(0%);
        }

        /* Chip pins */
        .chip-pins {
            position: absolute;
            display: flex;
            gap: 6px;
        }

        .chip-pins.top {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .chip-pins.bottom {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .chip-pins.left {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column;
        }

        .chip-pins.right {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            flex-direction: column;
        }

        .pin {
            width: 4px;
            height: 8px;
            background: #555;
            border-radius: 1px;
        }

        .chip-pins.left .pin,
        .chip-pins.right .pin {
            width: 8px;
            height: 4px;
        }

        .cpu-chip.active .pin {
            background: #00ffc8;
            box-shadow: 0 0 6px #00ffc8;
        }

        /* Agent name label */
        .chip-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: #666;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .cpu-chip.active .chip-label {
            color: #00ffc8;
        }

        /* Activity indicators that grow out from chip */
        .activity-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0,255,200,0.3);
            pointer-events: none;
            animation: ringExpand 2s ease-out forwards;
        }

        @keyframes ringExpand {
            0% { width: 120px; height: 120px; opacity: 0.8; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        /* Data streams flowing from chip */
        .data-stream {
            position: absolute;
            width: 2px;
            height: 0;
            background: linear-gradient(180deg, #00ffc8, transparent);
            transform-origin: top center;
            animation: streamFlow 1s ease-out forwards;
        }

        @keyframes streamFlow {
            0% { height: 0; opacity: 1; }
            100% { height: 100px; opacity: 0; }
        }

        /* Thought bubbles */
        .thought-bubble {
            position: absolute;
            background: rgba(10,10,20,0.95);
            border: 1px solid #00ffc8;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.7rem;
            color: #00ffc8;
            max-width: 200px;
            pointer-events: none;
            animation: bubbleAppear 0.3s ease-out forwards, bubbleFade 0.5s ease-in 3s forwards;
            box-shadow: 0 0 20px rgba(0,255,200,0.2);
            z-index: 50;
        }

        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 20px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #00ffc8;
        }

        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 21px;
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid rgba(10,10,20,0.95);
        }

        @keyframes bubbleAppear {
            0% { opacity: 0; transform: translateY(10px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes bubbleFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Tool execution indicators */
        .tool-indicator {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(10,10,20,0.9);
            border: 1px solid;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            animation: toolPop 0.3s ease-out forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes toolPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .tool-indicator.read { border-color: #60a5fa; color: #60a5fa; }
        .tool-indicator.write { border-color: #f59e0b; color: #f59e0b; }
        .tool-indicator.edit { border-color: #a855f7; color: #a855f7; }
        .tool-indicator.bash { border-color: #ef4444; color: #ef4444; }
        .tool-indicator.task { border-color: #10b981; color: #10b981; }
        .tool-indicator.glob { border-color: #06b6d4; color: #06b6d4; }
        .tool-indicator.grep { border-color: #84cc16; color: #84cc16; }

        /* Connection traces between chips */
        .trace-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffc8, transparent);
            transform-origin: left center;
            pointer-events: none;
            opacity: 0.3;
        }

        .trace-line.active {
            opacity: 1;
            animation: tracePulse 1s ease-in-out infinite;
        }

        @keyframes tracePulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Signal pulse traveling along trace */
        .signal-pulse {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00ffc8;
            border-radius: 50%;
            filter: blur(3px);
            animation: signalTravel 1s linear forwards;
        }

        @keyframes signalTravel {
            0% { left: 0%; opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* Processing particles around active chip */
        .processing-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffc8;
            border-radius: 50%;
            pointer-events: none;
        }

        /* Legend */
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10,10,20,0.9);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 0.7rem;
            z-index: 100;
        }

        .legend h3 {
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.65rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            color: #666;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            border: 1px solid;
        }

        /* Stats panel */
        .stats-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(10,10,20,0.9);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-size: 0.75rem;
            min-width: 180px;
            z-index: 100;
        }

        .stats-panel h3 {
            color: #00ffc8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.65rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #888;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
        }

        .stat-value.active {
            color: #00ff88;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #050510;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 2px solid #222;
            border-top-color: #00ffc8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #666;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Back link */
        .back-link {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
            z-index: 101;
        }

        .back-link:hover {
            color: #00ffc8;
        }
    </style>
</head>
<body>
    <div class="circuit-bg"></div>
    <div class="ambient-glow" style="top: 30%; left: 30%;"></div>
    <div class="ambient-glow" style="top: 70%; left: 70%; animation-delay: -10s;"></div>

    <div class="header">
        <h1>CPU Agent Network</h1>
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="proxyStatus"></div>
                <span id="proxyText">Connecting...</span>
            </div>
            <div class="status-item">
                <span id="agentCount">0 Agents</span>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link">← All Visualizations</a>

    <div class="canvas-container" id="canvasContainer"></div>

    <div class="legend">
        <h3>Tool Types</h3>
        <div class="legend-item">
            <div class="legend-color" style="border-color: #60a5fa; background: rgba(96,165,250,0.2);"></div>
            <span>Read</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="border-color: #f59e0b; background: rgba(245,158,11,0.2);"></div>
            <span>Write</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="border-color: #a855f7; background: rgba(168,85,247,0.2);"></div>
            <span>Edit</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="border-color: #ef4444; background: rgba(239,68,68,0.2);"></div>
            <span>Bash</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="border-color: #10b981; background: rgba(16,185,129,0.2);"></div>
            <span>Task</span>
        </div>
    </div>

    <div class="stats-panel">
        <h3>System Status</h3>
        <div class="stat-row">
            <span>Active Requests</span>
            <span class="stat-value active" id="activeRequests">0</span>
        </div>
        <div class="stat-row">
            <span>Running Tools</span>
            <span class="stat-value" id="runningTools">0</span>
        </div>
        <div class="stat-row">
            <span>Total Processed</span>
            <span class="stat-value" id="totalProcessed">0</span>
        </div>
        <div class="stat-row">
            <span>Uptime</span>
            <span class="stat-value" id="uptime">00:00</span>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing CPU Network</div>
    </div>

    <script>
        const container = document.getElementById('canvasContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const proxyStatus = document.getElementById('proxyStatus');
        const proxyText = document.getElementById('proxyText');

        // Agent configurations with different roles
        const agentTypes = [
            { id: 'task_planner', icon: '🎯', name: 'Task Planner' },
            { id: 'task_executor', icon: '⚡', name: 'Task Executor' },
            { id: 'proof_validator', icon: '✓', name: 'Proof Validator' },
            { id: 'code_generator', icon: '💻', name: 'Code Generator' },
            { id: 'test_planner', icon: '🧪', name: 'Test Planner' },
            { id: 'bug_analyzer', icon: '🔍', name: 'Bug Analyzer' },
            { id: 'feature_architect', icon: '📐', name: 'Feature Architect' },
            { id: 'system_designer', icon: '🏗️', name: 'System Designer' },
        ];

        // Thought phrases for different agent types
        const thoughts = {
            task_planner: [
                'Analyzing requirements...',
                'Breaking down into subtasks...',
                'Identifying dependencies...',
                'Creating execution plan...',
                'Estimating complexity...'
            ],
            task_executor: [
                'Executing step 1...',
                'Running tool sequence...',
                'Processing output...',
                'Validating results...',
                'Committing changes...'
            ],
            proof_validator: [
                'Checking assertions...',
                'Validating output format...',
                'Running verification...',
                'Comparing expected vs actual...',
                'Proof complete!'
            ],
            code_generator: [
                'Generating function...',
                'Writing implementation...',
                'Adding error handling...',
                'Optimizing code path...',
                'Code ready!'
            ],
            test_planner: [
                'Designing test cases...',
                'Identifying edge cases...',
                'Writing test script...',
                'Setting up fixtures...',
                'Tests defined!'
            ],
            bug_analyzer: [
                'Scanning for anomalies...',
                'Tracing error path...',
                'Identifying root cause...',
                'Analyzing stack trace...',
                'Bug located!'
            ],
            feature_architect: [
                'Designing feature...',
                'Planning API interface...',
                'Mapping data flow...',
                'Creating schema...',
                'Architecture ready!'
            ],
            system_designer: [
                'Analyzing system...',
                'Designing components...',
                'Planning integration...',
                'Optimizing structure...',
                'Design complete!'
            ]
        };

        // Tool icons
        const toolIcons = {
            Read: '📖',
            Write: '✏️',
            Edit: '🔧',
            Bash: '⚙️',
            Task: '📋',
            Glob: '🔎',
            Grep: '🔍',
            WebFetch: '🌐'
        };

        // State
        let agents = [];
        let requestData = [];
        let startTime = Date.now();
        let totalProcessed = 0;
        let isConnected = false;

        // Create a CPU chip element
        function createCPUChip(agent, x, y) {
            const chip = document.createElement('div');
            chip.className = 'cpu-chip';
            chip.id = `chip-${agent.id}`;
            chip.style.left = `${x}px`;
            chip.style.top = `${y}px`;

            // Core with icon
            const core = document.createElement('div');
            core.className = 'chip-core';
            const icon = document.createElement('span');
            icon.className = 'chip-icon';
            icon.textContent = agent.icon;
            core.appendChild(icon);
            chip.appendChild(core);

            // Pins on all sides
            ['top', 'bottom', 'left', 'right'].forEach(side => {
                const pins = document.createElement('div');
                pins.className = `chip-pins ${side}`;
                for (let i = 0; i < 5; i++) {
                    const pin = document.createElement('div');
                    pin.className = 'pin';
                    pins.appendChild(pin);
                }
                chip.appendChild(pins);
            });

            // Label
            const label = document.createElement('div');
            label.className = 'chip-label';
            label.textContent = agent.name;
            chip.appendChild(label);

            // Store agent data
            chip.dataset.agentId = agent.id;
            chip.agent = agent;

            container.appendChild(chip);
            return chip;
        }

        // Create activity ring around chip
        function createActivityRing(chip) {
            const ring = document.createElement('div');
            ring.className = 'activity-ring';
            const rect = chip.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            ring.style.left = `${rect.left - containerRect.left + rect.width/2}px`;
            ring.style.top = `${rect.top - containerRect.top + rect.height/2}px`;
            container.appendChild(ring);
            setTimeout(() => ring.remove(), 2000);
        }

        // Create thought bubble
        function createThoughtBubble(chip, text) {
            const bubble = document.createElement('div');
            bubble.className = 'thought-bubble';
            bubble.textContent = text;

            const rect = chip.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            bubble.style.left = `${rect.left - containerRect.left + rect.width/2 - 60}px`;
            bubble.style.top = `${rect.top - containerRect.top - 60}px`;

            container.appendChild(bubble);
            setTimeout(() => bubble.remove(), 4000);
        }

        // Create data stream from chip
        function createDataStream(chip, angle) {
            const stream = document.createElement('div');
            stream.className = 'data-stream';

            const rect = chip.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            stream.style.left = `${rect.left - containerRect.left + rect.width/2}px`;
            stream.style.top = `${rect.top - containerRect.top + rect.height/2}px`;
            stream.style.transform = `rotate(${angle}deg)`;

            container.appendChild(stream);
            setTimeout(() => stream.remove(), 1000);
        }

        // Create tool indicator
        function createToolIndicator(chip, toolName, angle, distance) {
            const indicator = document.createElement('div');
            indicator.className = `tool-indicator ${toolName.toLowerCase()}`;
            indicator.textContent = toolIcons[toolName] || '🔧';

            const rect = chip.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const rad = (angle * Math.PI) / 180;
            const x = rect.left - containerRect.left + rect.width/2 + Math.cos(rad) * distance - 15;
            const y = rect.top - containerRect.top + rect.height/2 + Math.sin(rad) * distance - 15;

            indicator.style.left = `${x}px`;
            indicator.style.top = `${y}px`;

            container.appendChild(indicator);
            setTimeout(() => {
                indicator.style.transition = 'opacity 0.3s';
                indicator.style.opacity = '0';
                setTimeout(() => indicator.remove(), 300);
            }, 2000);
        }

        // Create trace line between chips
        function createTraceLine(chip1, chip2) {
            const rect1 = chip1.getBoundingClientRect();
            const rect2 = chip2.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();

            const x1 = rect1.left - containerRect.left + rect1.width/2;
            const y1 = rect1.top - containerRect.top + rect1.height/2;
            const x2 = rect2.left - containerRect.left + rect2.width/2;
            const y2 = rect2.top - containerRect.top + rect2.height/2;

            const length = Math.sqrt(Math.pow(x2-x1, 2) + Math.pow(y2-y1, 2));
            const angle = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;

            const trace = document.createElement('div');
            trace.className = 'trace-line';
            trace.style.left = `${x1}px`;
            trace.style.top = `${y1}px`;
            trace.style.width = `${length}px`;
            trace.style.transform = `rotate(${angle}deg)`;

            container.appendChild(trace);
            return trace;
        }

        // Create signal pulse along trace
        function createSignalPulse(trace) {
            const pulse = document.createElement('div');
            pulse.className = 'signal-pulse';
            trace.appendChild(pulse);
            setTimeout(() => pulse.remove(), 1000);
        }

        // Create processing particles around chip
        function createProcessingParticles(chip) {
            const rect = chip.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const cx = rect.left - containerRect.left + rect.width/2;
            const cy = rect.top - containerRect.top + rect.height/2;

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'processing-particle';

                const angle = (i / 8) * Math.PI * 2;
                const radius = 80;
                const x = cx + Math.cos(angle) * radius;
                const y = cy + Math.sin(angle) * radius;

                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                // Animate orbit
                const duration = 2 + Math.random();
                particle.style.animation = `orbit${i} ${duration}s linear infinite`;

                // Create keyframe for this particle
                const style = document.createElement('style');
                style.textContent = `
                    @keyframes orbit${i} {
                        from { transform: rotate(${angle}rad) translateX(${radius}px) rotate(-${angle}rad); }
                        to { transform: rotate(${angle + Math.PI * 2}rad) translateX(${radius}px) rotate(-${angle + Math.PI * 2}rad); }
                    }
                `;
                document.head.appendChild(style);

                container.appendChild(particle);

                // Remove after some time
                setTimeout(() => {
                    particle.style.transition = 'opacity 0.5s';
                    particle.style.opacity = '0';
                    setTimeout(() => {
                        particle.remove();
                        style.remove();
                    }, 500);
                }, 3000 + Math.random() * 2000);
            }
        }

        // Initialize the visualization
        function initVisualization() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const radius = Math.min(centerX, centerY) - 150;

            // Create chips in a circle
            agentTypes.forEach((agent, i) => {
                const angle = (i / agentTypes.length) * Math.PI * 2 - Math.PI / 2;
                const x = centerX + Math.cos(angle) * radius - 60;
                const y = centerY + Math.sin(angle) * radius - 60;

                const chip = createCPUChip(agent, x, y);
                agents.push({ ...agent, chip, angle });
            });

            // Create trace lines between adjacent chips
            agents.forEach((agent, i) => {
                const nextAgent = agents[(i + 1) % agents.length];
                const trace = createTraceLine(agent.chip, nextAgent.chip);
                agent.trace = trace;
            });

            // Hide loading
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 1000);
        }

        // Activate an agent (simulate work)
        function activateAgent(agent) {
            const chip = agent.chip;
            chip.classList.add('active', 'thinking');

            // Create activity ring
            createActivityRing(chip);

            // Create processing particles
            createProcessingParticles(chip);

            // Show thought bubble
            const agentThoughts = thoughts[agent.id] || thoughts.task_executor;
            const thought = agentThoughts[Math.floor(Math.random() * agentThoughts.length)];
            createThoughtBubble(chip, thought);

            // Create data streams
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    createDataStream(chip, Math.random() * 360);
                }, i * 200);
            }

            // Create tool indicators
            const tools = ['Read', 'Write', 'Edit', 'Bash', 'Task', 'Glob'];
            const numTools = 1 + Math.floor(Math.random() * 3);
            for (let i = 0; i < numTools; i++) {
                setTimeout(() => {
                    const tool = tools[Math.floor(Math.random() * tools.length)];
                    const angle = -90 + (i - numTools/2 + 0.5) * 40;
                    createToolIndicator(chip, tool, angle, 100);
                }, 500 + i * 500);
            }

            // Signal pulse to next agent
            if (agent.trace) {
                setTimeout(() => {
                    agent.trace.classList.add('active');
                    createSignalPulse(agent.trace);
                    setTimeout(() => {
                        agent.trace.classList.remove('active');
                    }, 1000);
                }, 1500);
            }

            // Deactivate after work
            setTimeout(() => {
                chip.classList.remove('active', 'thinking');
                totalProcessed++;
            }, 3000 + Math.random() * 2000);
        }

        // Fetch request data from proxy
        async function fetchRequests() {
            try {
                const response = await fetch('http://localhost:8081/api/chat/requests');
                if (response.ok) {
                    const data = await response.json();
                    requestData = data.requests || [];
                    isConnected = true;
                    proxyStatus.classList.add('online');
                    proxyText.textContent = 'Connected';

                    // Process active requests
                    processRequests();
                } else {
                    isConnected = false;
                    proxyStatus.classList.remove('online');
                    proxyText.textContent = 'Error';
                }
            } catch (e) {
                isConnected = false;
                proxyStatus.classList.remove('online');
                proxyText.textContent = 'Offline';
            }
        }

        // Process requests and activate agents
        function processRequests() {
            const activeRequests = requestData.filter(r => r.status === 'running');
            let runningToolCount = 0;

            activeRequests.forEach((request, i) => {
                // Find running tools
                if (request.tools) {
                    const runningTools = request.tools.filter(t => t.status === 'running');
                    runningToolCount += runningTools.length;

                    runningTools.forEach(tool => {
                        // Activate a random agent for this tool
                        const agent = agents[Math.floor(Math.random() * agents.length)];
                        if (!agent.chip.classList.contains('active')) {
                            activateAgent(agent);
                        }
                    });
                }
            });

            // Update stats
            document.getElementById('activeRequests').textContent = activeRequests.length;
            document.getElementById('runningTools').textContent = runningToolCount;
            document.getElementById('totalProcessed').textContent = totalProcessed;
            document.getElementById('agentCount').textContent = `${agents.length} Agents`;
        }

        // Update uptime display
        function updateUptime() {
            const elapsed = Date.now() - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            document.getElementById('uptime').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Demo mode - simulate activity when no proxy
        function demoMode() {
            setInterval(() => {
                if (!isConnected) {
                    const randomAgent = agents[Math.floor(Math.random() * agents.length)];
                    if (!randomAgent.chip.classList.contains('active')) {
                        activateAgent(randomAgent);
                    }
                }
            }, 2000);
        }

        // Initialize
        initVisualization();
        fetchRequests();
        setInterval(fetchRequests, 2000);
        setInterval(updateUptime, 1000);
        demoMode();

        // Handle window resize
        window.addEventListener('resize', () => {
            // Remove existing elements
            document.querySelectorAll('.cpu-chip, .trace-line').forEach(el => el.remove());
            agents = [];
            initVisualization();
        });
    </script>
</body>
</html>
